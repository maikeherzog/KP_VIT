server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: fall back to index.html for client-side routing
    location / {
        try_files $uri /index.html;
    }

    # long-cache the hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
